[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-pivot"
version = "0.1.0"
description = "Asynchronous Offensive Network Pivoting & Service Fingerprinting Engine"
readme = "README.md"
authors = [{ name = "Lazarus Ebi", email = "lazarusebi111@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
spectre = "spectre.cli:main"
